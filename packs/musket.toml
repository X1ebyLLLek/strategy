# ---------------- флот ----------------
# Корабли строят верфи из товаров рынка (equip — как снаряжение части), months месяцев на стапеле; crew —
# тысяч моряков. gun — бортовой залп, armor — толщина дубового борта, hull — сколько ядер держит корпус,
# stealth — как трудно найти (0…1), speed — ход, raid — сколько призов берёт в месяц, escort — как
# охраняет свои купеческие суда. supply — товары на месяц в море (в порту — треть).
