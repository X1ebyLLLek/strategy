# ---------------- торговля между странами ----------------
# Парусники и телеги: море дёшево, суша дорога. 1 пиксель карты ≈ 20 км.
[trade]
owner = "merchants"   # кто возит и берёт наценку
margin = 0.05         # наценка купцов с проданного чужого товара
sea = 0.00015         # доля товара (громоздкости 1), теряемая за пиксель по морю
land = 0.0015         # то же по равнине (горы, болота — дороже, см. terrain)
port = 0.03           # погрузка/выгрузка в порту
sea_speed = 220       # пикселей в месяц
land_speed = 40

# ---------------- война ----------------
# Как в индустриальном наборе: class — чем часть является для чужого огня, fire — урон в
# день по каждому классу, line — front / support / air, width — место во фронте.
# Одна часть — примерно батальон или батарея. Солдаты и лошади едят хлеб.
[science]
learned = ["nobles", "merchants"]   # кто может работать в лабораториях: дворяне и купцы
share = 0.05      # обычная доля трат казны на науку (когда наука включена)

[ui]
# облик экрана игры: staff (штабная бумага), parchment (пергамент), rust (ржавый металл)
theme = "parchment"   # пергамент и сургуч

[war]
width = 12
days = 30         # самый долгий бой: месяц
man_cost = 2
scale = 0.1       # доля товара рынка за единицей снаряжения и снабжения части (рынок считает товары
                  # по месячной нужде миллиона людей; батальон не съедает хлеб миллиона)
crew = 10         # сколько тысяч человек за единицей men части (часть фронта — соединение)

[[unit]]
id = "line"
model = "мушкет"      # образец снаряжения (заводы учатся его делать; наука даёт новые)
armor = 0         # броня: огонь, что её не пробивает, большей частью отскакивает
pierce = 1        # что пробивает
attack = 1.0      # огонь в наступлении против обычного (прорыв)
defend = 1.1      # огонь в обороне
complexity = 1.0  # сложность производства (заводы осваивают дольше, новый образец роняет выпуск сильнее)
norms = true      # норма оснащения: бедно / штатно / богато (пулемёты, миномёты, грузовики на батальон)
