role = "line"
equip = { wood = 60, iron = 8, cloth = 6 }
supply = { bread = 0.3, powder = 0.15 }
months = 24
crew = 0.7
gun = 8
armor = 4
hull = 30
speed = 0.8
raid = 0.5
