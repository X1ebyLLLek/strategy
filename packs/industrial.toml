# ---------------- флот ----------------
# Корабли строят верфи из товаров рынка (equip — как снаряжение части, в долях war.scale), за months
# месяцев на стапеле; crew — тысяч моряков. gun — пушки против кораблей, armor — броня (пушки легче её
# бьют вполсилы и слабее), hull — сколько вреда держит корпус, torpedo — торпеды (бьют сквозь любую
# броню), asw — глубинные бомбы (только они находят подлодки), stealth — как трудно найти (0…1),
# speed — скорость, raid — сколько топит торговых судов в месяц рейдов, escort — как охраняет свои.
# supply — товары на месяц в море (в порту — треть). role: line, cruiser, screen, sub, raider.
