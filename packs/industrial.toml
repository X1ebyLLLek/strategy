# Набор эпохи: индустриальная (≈1900–1950). Движок ничего не знает об эпохах —
# всё ниже можно менять, добавлять свои товары, группы, отрасли и ресурсы.
#
# Единицы: население — миллионы людей; нужды — на миллион человек в месяц;
# входы/выходы отраслей — на миллион работников в месяц; start — доля всего
# населения, занятая в отрасли в начале игры.

name = "Индустриальная эпоха"
about = "Уголь, сталь, железные дороги, массовые армии."

[government]
tax = 0.15        # доля доходов, уходящая в казну
military = 0.4    # доля трат казны на военные товары

[world]
people = [1000.0, 1750.0]   # сколько миллионов людей в мире (каждый мир — свой счёт между ними): Земля 1830-х … 1910-х

