# ---------------- торговля между странами ----------------
# Пароходы и железные дороги: возить дёшево и быстро. 1 пиксель карты ≈ 20 км.
[trade]
owner = "owners"
margin = 0.03
sea = 0.00005
land = 0.0003
port = 0.02
sea_speed = 600
land_speed = 900

# ---------------- война ----------------
# Бой считает движок; здесь — какие бывают войска. class — чем часть является для чужого
# огня (классы задаёт сам набор), fire — урон в день по каждому классу, toughness — сколько
# урона выдерживает одна часть, cover — насколько часть пользуется укрытием местности
# (1 — полностью), terrain — её огонь на этой местности против равнины, line — где стоит:
# front (держит фронт), support (бьёт из-за линии), air (в воздухе). equip — товары, чтобы
# её создать, supply — товары на месяц боёв, width — сколько места во фронте занимает
# (1 — обычная часть). Одна часть — примерно батальон.
[science]
learned = ["clerks", "owners"]   # кто может работать в лабораториях: служащие и собственники
share = 0.05      # обычная доля трат казны на науку (когда наука включена)

[ui]
# облик экрана игры: staff (штабная бумага), parchment (пергамент), rust (ржавый металл)
theme = "staff"   # штабная бумага и папки

[war]
width = 12        # сколько частей передней линии воюют рядом на равнине
days = 30         # самый долгий бой: месяц
man_cost = 5      # цена тысячи человек против товаров по начальным ценам
scale = 0.02      # доля товара рынка за единицей снаряжения и снабжения части (рынок считает товары
                  # по месячной нужде миллиона людей; батальон не съедает хлеб миллиона)
crew = 10         # сколько тысяч человек за единицей men части (часть фронта — соединение)

[[unit]]
id = "infantry"
model = "винтовка"      # образец снаряжения (заводы учатся его делать; наука даёт новые)
