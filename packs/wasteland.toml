# Роты поддержки (война дивизиями): одна на дивизию, служит всей дивизии — крупной столько же,
# сколько мелкой, за ту же цену. men — в единицах части (батальон — десятая), товары — на роту.
# dig — окапывается во столько раз быстрее; rough — доля дней марша по лесу, холмам, болоту, горам;
# see — на сколько провинций глубже видит врага; org — во столько раз быстрее приходит в себя;
# saved — доля погибших, что возвращаются в строй; eat — доля снабжения, что ест дивизия;
# fire — во столько раз сильнее огонь; salvage — доля снаряжения, что не бросают при отходе.
[[support]]
