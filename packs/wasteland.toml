# ---------------- торговля между странами ----------------
# Караваны по пустошам и редкие лодки: дорого, медленно, разбойники.
[trade]
owner = "warlords"
margin = 0.1
sea = 0.0005
land = 0.002
port = 0.05
sea_speed = 100
land_speed = 30

# ---------------- война ----------------
# Как в индустриальном наборе: class — чем часть является для чужого огня, fire — урон в
# день по каждому классу, line — front / support / air, width — место во фронте.
# Одна часть — банда в сотню-другую стволов или пара машин. Пьют воду, жгут горючее.
[science]
learned = ["mechanics"]   # кто может работать в лабораториях: механики
share = 0.05      # обычная доля трат казны на науку (когда наука включена)

[ui]
# облик экрана игры: staff (штабная бумага), parchment (пергамент), rust (ржавый металл)
theme = "rust"   # ржавый металл и трафарет

[war]
width = 10
days = 30         # самый долгий бой: месяц
man_cost = 1
scale = 0.04      # доля товара рынка за единицей снаряжения и снабжения части (рынок считает товары
                  # по месячной нужде миллиона людей; батальон не съедает хлеб миллиона)
crew = 10         # сколько тысяч человек за единицей men части (часть фронта — соединение)

[[unit]]
id = "raiders"
model = "самопал"      # образец снаряжения (заводы учатся его делать; наука даёт новые)
armor = 0         # броня: огонь, что её не пробивает, большей частью отскакивает
pierce = 1        # что пробивает
attack = 1.05      # огонь в наступлении против обычного (прорыв)
defend = 1.0      # огонь в обороне
complexity = 0.8  # сложность производства (заводы осваивают дольше, новый образец роняет выпуск сильнее)
norms = true      # норма оснащения: бедно / штатно / богато (пулемёты, миномёты, грузовики на батальон)
